spring:
  datasource:
    url: ${PARKVISION_DATASOURCE_URL:jdbc:mysql://localhost:3306/parkvision?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${PARKVISION_DB_USER:parkvision}
    password: ${PARKVISION_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      platform: mysql
      schema-locations: optional:classpath:schema-mysql.sql
