server:
  port: 8080

spring:
  application:
    name: parkvision-backend
  datasource:
    url: ${PARKVISION_DATASOURCE_URL:jdbc:h2:file:./data/parkvision;MODE=MySQL;DB_CLOSE_DELAY=-1}
    username: ${PARKVISION_DATASOURCE_USERNAME:sa}
    password: ${PARKVISION_DATASOURCE_PASSWORD:}
    driver-class-name: ${PARKVISION_DATASOURCE_DRIVER:org.h2.Driver}
  jackson:
    serialization:
      write-dates-as-timestamps: false
  sql:
    init:
      mode: always
      platform: ${PARKVISION_SQL_PLATFORM:h2}
      schema-locations: optional:classpath:schema-${PARKVISION_SQL_PLATFORM:h2}.sql
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info

parkvision:
  persistence:
    mode: ${PARKVISION_PERSISTENCE_MODE:jdbc}
  security:
    jwt:
      secret: ${PARKVISION_JWT_SECRET:parkvision-cps-demo-secret-key-please-override-in-production-0123456789}
      expiration-minutes: ${PARKVISION_JWT_EXPIRATION_MINUTES:720}
  ai:
    inference-mode: ${PARKVISION_AI_INFERENCE_MODE:device-simulated}
  vision:
    lpr:
      # 车牌识别引擎：none=内置引擎；hyperlpr=本地 HyperLPR 服务；baidu=百度车牌识别 OCR
      provider: ${PARKVISION_LPR_PROVIDER:none}
      hyperlpr:
        url: ${PARKVISION_HYPERLPR_URL:http://localhost:8715/recognize}
      baidu:
        api-key: ${BAIDU_OCR_API_KEY:}
        secret-key: ${BAIDU_OCR_SECRET_KEY:}
  devices:
    simulation-enabled: ${PARKVISION_DEVICE_SIMULATION_ENABLED:true}
    simulation-interval-ms: ${PARKVISION_DEVICE_SIMULATION_INTERVAL_MS:4000}
  twin:
    broadcast-interval-ms: ${PARKVISION_TWIN_BROADCAST_INTERVAL_MS:1000}
